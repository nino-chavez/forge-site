# forge-site Spec Template: Digital Content
# Usage: Copy to new project's specchain/specs/ and customize

archetype: digital-content
name: "[CLIENT] Digital Content Site"
description: "Subscription-based content access for [CLIENT]"

defaults:
  framework: next       # or sveltekit
  database: supabase    # for user/subscription data
  cms: sanity           # for content library
  auth: clerk           # or supabase (if sveltekit)
  payments: stripe
  email: resend
  video: mux            # or external (e.g., TrainHeroic, Vimeo)
  analytics: vercel+posthog
  deployment: vercel

recon_questions:
  - "What type of content? (video, articles, downloads, courses, mixed)"
  - "How many content items at launch?"
  - "Pricing model? (monthly subscription, one-time purchase, tiered, free tier?)"
  - "Price points? (what does each tier cost?)"
  - "What features differentiate tiers?"
  - "How is content delivered now? (YouTube, email, external platform, nothing)"
  - "Do you have existing content ready or starting from scratch?"
  - "Who creates the content? (you, team, contributors)"
  - "Custom domain or subdomain?"
  - "Do you need a free preview / free tier?"

required_modules:
  - payments-stripe
  - auth-clerk           # swap to auth-supabase if sveltekit
  - feature-gating
  - email-resend
  - analytics-vercel

recommended_modules:
  - cms-sanity           # if non-technical content editor
  - video-mux            # if video content
  - analytics-posthog    # conversion funnel tracking
  - seo-structured-data  # for marketing pages

optional_modules:
  - booking-calcom       # if offering 1:1 sessions
  - contact-forms        # if general inquiries needed

sitemap:
  - path: "/"
    purpose: "Homepage — hero, value prop, pricing preview, testimonials, CTA"
  - path: "/pricing"
    purpose: "Pricing page — tier comparison, feature matrix, checkout CTAs"
  - path: "/content"
    purpose: "Content catalog / library (gated by tier)"
  - path: "/content/[slug]"
    purpose: "Content detail — video player or article (gated)"
  - path: "/sign-in"
    purpose: "Clerk sign-in page"
  - path: "/sign-up"
    purpose: "Clerk sign-up page"
  - path: "/account"
    purpose: "User account settings"
  - path: "/account/billing"
    purpose: "Subscription management, payment history, billing portal link"
  - path: "/about"
    purpose: "About the creator/business"
  - path: "/contact"
    purpose: "Contact form (optional)"
  - path: "/api/checkout"
    purpose: "POST — Stripe checkout session creation"
  - path: "/api/webhooks/stripe"
    purpose: "POST — Stripe webhook receiver (12 event handlers)"
  - path: "/api/billing"
    purpose: "GET — user subscription details"
  - path: "/api/billing/portal"
    purpose: "POST — Stripe billing portal session"

task_groups:
  - name: "Project Setup"
    tasks:
      - "Scaffold Next.js 16 project with App Router"
      - "Install Tailwind CSS 4, configure design tokens from brand-forge"
      - "Link to Vercel project, pull environment variables"
      - "Configure vercel.json (or vercel.ts)"
      - "Set up Supabase project, create initial schema (users, subscriptions, content_purchases, payment_history)"

  - name: "Authentication"
    module: auth-clerk
    tasks:
      - "Install @clerk/nextjs, add to Vercel via Marketplace"
      - "Create proxy.ts with clerkMiddleware()"
      - "Create /sign-in and /sign-up pages"
      - "Create /account page with user profile"
      - "Set NEXT_PUBLIC_CLERK_SIGN_IN_URL and SIGN_UP_URL env vars"
      - "Verify auth() works in Server Components"

  - name: "Content Management"
    module: cms-sanity
    tasks:
      - "Create Sanity project, install sanity + @sanity/client"
      - "Define content schemas (content item, category, siteSettings)"
      - "Configure Sanity Studio at /studio (exclude from auth middleware)"
      - "Build content listing page (/content) with tier badges"
      - "Build content detail page (/content/[slug]) with access gating"
      - "Seed initial content for testing"

  - name: "Video Delivery"
    module: video-mux
    condition: "if content_type includes video"
    tasks:
      - "Set up Mux account, configure API credentials"
      - "Create video upload workflow (admin or API)"
      - "Implement signed playback URLs for gated content"
      - "Build video player component with Mux Player"
      - "Set up Mux webhook for encoding completion"

  - name: "Payments & Billing"
    module: payments-stripe
    tasks:
      - "Configure Stripe products and prices for each tier"
      - "Create /api/checkout endpoint (one-time + subscription modes)"
      - "Create /api/webhooks/stripe with signature verification"
      - "Implement all 12 webhook handlers (checkout.session.completed, subscription CRUD, invoice events, disputes, refunds, payment methods, SCA)"
      - "Create /api/billing endpoint (subscription details)"
      - "Create /api/billing/portal endpoint (Stripe portal session)"
      - "Build /account/billing page (PlanCard, PaymentHistory, PaymentMethodCard)"
      - "Build UpgradePrompt component for feature gates"
      - "Test full checkout flow in Stripe test mode"

  - name: "Feature Gating"
    module: feature-gating
    tasks:
      - "Define Feature type, Tier type, FEATURE_TIERS map"
      - "Define TIER_LIMITS constants"
      - "Implement BillingContext (canAccess, isAtLimit, upgradeRequired)"
      - "Wire content pages to check billing context before rendering"
      - "Build LimitWarning component for resource limits"

  - name: "Email"
    module: email-resend
    tasks:
      - "Set up Resend account, verify domain"
      - "Create welcome email template"
      - "Create payment receipt template"
      - "Create payment failed / dunning template (with billing portal link)"
      - "Create upcoming renewal template"
      - "Wire email sending into webhook handlers"

  - name: "Marketing & SEO"
    tasks:
      - "Build homepage (hero, value prop, pricing preview, testimonials)"
      - "Build /pricing page with tier comparison matrix"
      - "Build /about page"
      - "Add JSON-LD structured data (Organization, WebSite)"
      - "Configure OpenGraph and Twitter Card metadata"
      - "Generate sitemap.xml"

  - name: "Polish & Launch"
    tasks:
      - "Run brand-forge for final brand identity"
      - "Run signal-forge for site copy (hero, about, pricing descriptions)"
      - "Run image-gen for hero image and OG social card"
      - "Install @vercel/analytics and @vercel/speed-insights"
      - "Configure PostHog for conversion tracking"
      - "Run Lighthouse audit (target: >80 perf, >90 a11y)"
      - "Test mobile responsiveness on all pages"
      - "Deploy preview → client review → deploy production"
      - "Run claude-docs-toolkit for handoff documentation"

verification:
  - "User can sign up, subscribe, and access gated content"
  - "Stripe test payment completes and webhook updates database"
  - "Feature gating correctly blocks unpaid content"
  - "Billing page shows subscription status and payment history"
  - "Dunning email sends on payment failure with billing portal link"
  - "Mobile responsive on all pages"
  - "Lighthouse performance >80, accessibility >90"
